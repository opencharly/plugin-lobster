# golangci-lint config for the plugin-lobster module.
#
# Mirrors charly's root config (`default: standard` + gofmt) and plugin-task's
# module config — with ONE deliberate deviation: ST1005 (error strings must not
# be capitalized) is OFF. charly's root config records that a module MAY keep
# its own closer config when the baseline does not fit it; this is that case.
#
# WHY ST1005 IS OFF HERE. This module's error text is a PRODUCT SURFACE, not an
# internal detail, and it is capitalized by contract in both places it comes
# from:
#   * `lobster.go` is a port of upstream lobster's `load.ts` validator, and its
#     own header records the rule: "the error strings are upstream's, verbatim:
#     they are the operator's only diagnostic, and a reworded one is a different
#     product." 68 of this module's 110 ST1005 hits are exactly those strings.
#   * the native executor/gate/batch/refs files carry the messages of the engine
#     MOVED from plugin-pipeline, whose CI never ran a linter at all — so they
#     were never held to ST1005 either, and rewording them during the move would
#     be a behavioural change smuggled into a move.
# This module's own tests assert the capitalized form (engine_test.go:
# `strings.Contains(err.Error(), "Unknown command: frobnicate")`), so lowercasing
# would be a product change plus a test break — not a lint fix. Everything else
# in the standard set, including the rest of staticcheck (QF*, SA*), still applies.
#
# The errcheck exclusions below are the SAME best-effort output exclusions
# charly's root config and plugin-task carry: a CLI prints to stdout, so an
# unchecked fmt.Fprint* is the idiomatic form.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
    staticcheck:
      # golangci-lint's default staticcheck check set, plus -ST1005 (see above).
      # The six default exclusions are listed EXPLICITLY because setting `checks`
      # REPLACES the defaults — omitting them would re-enable ST1000/ST1003/ST1016/
      # ST1020/ST1021/ST1022 and fail CI on findings the defaults suppress.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1005

formatters:
  enable:
    - gofmt
