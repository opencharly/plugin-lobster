# The Go gates for this plugin's own module.
#
# plugin-lobster ships a real Go module (go.mod + the engine package), so the
# rulebook's "tests that can fail" (R7) requires a gate that actually runs them:
# gofmt, the configured golangci-lint set, go vet, and the unit tests (which
# exercise the lobster executor semantics, the approval/input resume round-trip,
# the lowered-pair consumption, and the systemd-timer emission).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: candy/plugin-lobster/go.mod
          cache-dependency-path: candy/plugin-lobster/go.sum

      - name: gofmt
        working-directory: candy/plugin-lobster
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: candy/plugin-lobster

      - name: go vet
        working-directory: candy/plugin-lobster
        run: go vet ./...

      - name: go test
        working-directory: candy/plugin-lobster
        run: go test ./...

      # The schema is the single source for params/cue_types_gen.go, so the committed
      # generated file must be exactly what the schema reproduces. Same procedure as
      # plugin-pipeline's job: splice the package clause onto the schema, generate, and
      # diff (ignoring the generated header's package line).
      - name: Install cue (pinned)
        run: go install cuelang.org/go/cmd/cue@v0.16.1

      - name: Generated params are reproducible (cue:gen)
        run: |
          rm -rf /tmp/cuegenpkg && mkdir -p /tmp/cuegenpkg
          echo 'package params' > /tmp/cuegenpkg/lobster.cue
          cat candy/plugin-lobster/schema/lobster.cue >> /tmp/cuegenpkg/lobster.cue
          cd /tmp/cuegenpkg && cue exp gengotypes .
          diff <(sed '1,1d' /tmp/cuegenpkg/cue_types_params_gen.go) \
               <(sed '1,1d' "$GITHUB_WORKSPACE/candy/plugin-lobster/params/cue_types_gen.go")
